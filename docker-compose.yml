services:
  backend1:
    build: ./src/backend
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE: backend1
    expose:
      - "5000"

  backend2:
    build: ./src/backend
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE: backend2
    expose:
      - "5000"

  backend3:
    build: ./src/backend
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE: backend3
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3