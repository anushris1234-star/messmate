events {}

http {
    upstream messmate_backends {
        server 127.0.0.1:5001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:5002 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:5003 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://messmate_backends;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
