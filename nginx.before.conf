events {}

http {
    upstream messmate_backends {
        server 127.0.0.1:5001 max_fails=0;
        server 127.0.0.1:5002 max_fails=0;
        server 127.0.0.1:5003 max_fails=0;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://messmate_backends;
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
